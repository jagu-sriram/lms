# =====================================================================
#  "demo" profile - runs with an in-memory H2 database, no MySQL needed.
#  Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=demo
#  Data is lost when the app stops.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:lmsdemo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop

app.seed.demo-data=true
