# =====================================================================
#  LMS Progress Tracker - default profile (MySQL)
#  Every sensitive value can be overridden with an environment variable.
# =====================================================================
spring.application.name=lms-progress-tracker
server.port=${SERVER_PORT:8080}

# ---------- Database (MySQL 8) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_progress?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:lms_user}
spring.datasource.password=${DB_PASSWORD:lms_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by db/schema-mysql.sql (idempotent CREATE TABLE IF NOT EXISTS).
# Hibernate never alters the schema in this profile.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-mysql.sql
spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JSON hardening ----------
# Unknown fields (e.g. "role", "studentId") are rejected -> blocks mass-assignment attacks
spring.jackson.deserialization.fail-on-unknown-properties=true
# 50.5 is not silently truncated to 50
spring.jackson.deserialization.accept-float-as-int=false

# ---------- Never leak internals ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ---------- Security ----------
# Base64-encoded HMAC key, at least 256 bits. ALWAYS override JWT_SECRET outside local dev.
app.security.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5}
app.security.jwt.expiration=PT2H
app.security.jwt.issuer=lms-progress-tracker
app.security.bcrypt-strength=12
app.security.login.max-failed-attempts=5
app.security.login.lock-duration=PT15M

# ---------- Demo data (users, courses, lessons, assessments, enrollments) ----------
app.seed.demo-data=${SEED_DEMO_DATA:true}

# ---------- Logging (SLF4J / Logback) ----------
logging.level.root=INFO
logging.level.com.lms.tracker=INFO
logging.pattern.level=%5p [req:%X{requestId:-}]
