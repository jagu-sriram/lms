# Tests run against an in-memory H2 database - no MySQL needed for "mvn test".
spring.datasource.url=jdbc:h2:mem:lmstest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop

# Fast hashing for tests only (production uses 12)
app.security.bcrypt-strength=4
app.security.login.max-failed-attempts=5
app.security.login.lock-duration=PT15M

# Tests create exactly the data they need
app.seed.demo-data=false

logging.level.com.lms.tracker=INFO
